<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CiaTelecom Services | Fiber, ISP, Cable TV, ONT & Modem</title>
    <meta
      name="description"
      content="Single-company ecommerce storefront for ISP, cable TV, fiber, ONT and modem products with direct WhatsApp inquiry."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="store-page">
    <header class="store-header" id="siteHeader">
      <div class="header-top">
        <a class="store-brand" href="#catalog" aria-label="CiaTelecom Services">
          <img class="brand-logo" src="./ciatelecom-logo.png" alt="CiaTelecom logo" />
          <span class="brand-copy">
            <strong>CiaTelecom Services</strong>
            <small>Fiber, Broadband and Cable Hardware</small>
          </span>
        </a>

        <form class="header-search" role="search">
          <input id="productSearch" type="search" placeholder="Search ONT, modem, fiber cable, splitter..." />
          <button type="button">Search</button>
        </form>
      </div>
    </header>

    <main class="store-main">
      <section class="category-spotlight" id="categorySpotlight" aria-label="Shop by category highlights">
        <button class="spotlight-tile spotlight-wide" type="button" data-category="Fiber Products">
          <span class="spotlight-eyebrow">Fiber Products</span>
          <span class="spotlight-title">FTTH &amp; fiber network essentials</span>
          <span class="spotlight-link">Shop fiber range →</span>
        </button>
        <button class="spotlight-tile spotlight-tall" type="button" data-category="ISP Equipment">
          <span class="spotlight-eyebrow">ISP Equipment</span>
          <span class="spotlight-title">Modems &amp; routers</span>
        </button>
        <button class="spotlight-tile" type="button" data-category="Cable TV Supply">
          <span class="spotlight-eyebrow">Cable TV</span>
          <span class="spotlight-title">Splitters &amp; coaxial</span>
        </button>
        <button class="spotlight-tile" type="button" data-category="Accessories">
          <span class="spotlight-eyebrow">Accessories</span>
          <span class="spotlight-title">Patch cords &amp; more</span>
        </button>
      </section>

      <section class="catalog-shell" id="catalog">
        <div class="toolbar-panel">
          <div class="toolbar-head">
            <div>
              <span class="section-eyebrow">Full Catalog</span>
              <h2>Shop By Category</h2>
            </div>
            <label class="sort-wrap">
              <span>Sort by</span>
              <select id="sortSelect">
                <option value="featured">Featured</option>
                <option value="az">Name A-Z</option>
                <option value="vendor">Latest Added</option>
              </select>
            </label>
          </div>

          <div class="filter-bar" id="filterRow" aria-label="Product category filters"></div>
        </div>

        <div class="product-grid" id="productGrid" aria-live="polite"></div>
      </section>
    </main>

    <footer class="store-footer">
      <div>
        <strong>CiaTelecom Services</strong>
        <p>One company. One storefront. Direct WhatsApp inquiry.</p>
        <p class="footer-copy">Copyright &#169; CiaTelecom. All rights reserved.</p>
      </div>
      <button class="footer-btn" type="button" data-whatsapp-trigger="footer-contact">
        Contact Company
      </button>
    </footer>

    <button class="floating-chat" type="button" data-whatsapp-trigger="floating-cta">
      WhatsApp Inquiry
    </button>

    <div id="productDetailMount"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./app.js"></script>
  </body>
</html>
